# PT: process token table, 256 total entries; indexed SRAM, no backing table.
# teeId64 + processId64 + processToken16 + state2 (Free/Active/Revoking)
# = 146 bits -> 32 B. The parent TEE must have an active TT entry.
# A trusted slot index addresses a row; both identity fields are in the payload.
# Identity comparison and free-slot lookup are external control logic.
# Tokens match the existing CACTI TEE16/process16 proposal, not gem5 widths.
# No live-entry eviction; no token wrap/reuse while stale references exist.
# 22nm HP, one bank, 360 K; one RW port, no associative search.
